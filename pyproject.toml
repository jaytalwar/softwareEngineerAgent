[project]
name = "swe-agent"
version = "0.1.0"
description = "Multi-agent AI software engineer: orchestration core and tool layer"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi>=0.141.1",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swe_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["sandbox_fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src:tests"
explicit_package_bases = true
files = ["src", "tests"]
